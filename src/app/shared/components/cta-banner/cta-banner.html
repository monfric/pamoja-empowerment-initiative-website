<section class="section pt-0">
  <div class="container">
    <div class="cta rounded-brand text-white" appReveal="zoom-in">
      <div class="row align-items-center g-4">
        <div class="col-lg-8">
          <h2 class="fw-bold text-white">{{ title() }}</h2>
          <p class="mb-0 opacity-75">{{ text() }}</p>
        </div>
        <div class="col-lg-4 text-lg-end">
          <a [routerLink]="buttonLink()" class="btn btn-secondary btn-lg">{{ buttonLabel() }}</a>
        </div>
      </div>
    </div>
  </div>
</section>
